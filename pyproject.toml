[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-word-production"
version = "0.1.0"
description = "Deterministic tools and guardrails for Arabic-first and bilingual Microsoft Word documents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Ahmed Elbanna / Bannovich", email = "73133823+Bannovich@users.noreply.github.com" }
]
keywords = ["arabic", "bilingual", "docx", "microsoft-word", "rtl", "wordprocessingml"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Office Suites"
]
dependencies = [
  "python-docx>=1.2.0,<2",
  "lxml>=6.0,<7",
  "Pillow>=11.0,<13"
]

[project.urls]
Homepage = "https://github.com/Bannovich/arabic-word-production"
Documentation = "https://github.com/Bannovich/arabic-word-production#readme"
Issues = "https://github.com/Bannovich/arabic-word-production/issues"
Source = "https://github.com/Bannovich/arabic-word-production"

[tool.setuptools]
packages = []
include-package-data = false
