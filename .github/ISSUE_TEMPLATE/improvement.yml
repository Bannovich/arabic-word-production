name: Improvement or new guardrail proposal
description: Propose a scoped workflow, documentation, compatibility, or guardrail improvement.
title: "[IMPROVEMENT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        A useful proposal connects a real problem to observable evidence and regression protection. Do not paste private conversations or client documents as background.
  - type: input
    id: environment
    attributes:
      label: Affected host, application, and version
      placeholder: Codex desktop; Word Desktop build; compatible Agent Skills host
    validations:
      required: true
  - type: input
    id: locale
    attributes:
      label: Affected locale and content direction
      placeholder: Arabic (Egypt), mixed Arabic-English
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain who is affected and what currently fails or requires unnecessary work.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Privacy-safe evidence
      description: Provide synthetic reproduction evidence, measurements, or public standards references.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Keep the proposal scoped and state what should remain unchanged.
    validations:
      required: true
  - type: textarea
    id: regression
    attributes:
      label: Suggested regression protection
      description: Name an automated invariant or an exact manual application protocol.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Tradeoffs and validation surfaces
      description: List affected routes, applications, compatibility claims, or performance costs.
  - type: textarea
    id: audit
    attributes:
      label: Sanitized audit or measurement summary
      description: Use Not applicable when the proposal is documentation-only.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: This proposal contains no confidential source material, raw conversation, secret, or personal data.
          required: true
        - label: I have permission to share every attached synthetic or sanitized sample publicly.
          required: true
