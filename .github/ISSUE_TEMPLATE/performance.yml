name: Performance or repeated-repair problem
description: Report a measured slow route, repeated repair, or avoidable fallback with synthetic input.
title: "[PERFORMANCE] "
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        Timing claims need measured evidence. Remove local absolute paths, usernames, document content, and credentials from logs before posting.
  - type: input
    id: release
    attributes:
      label: Project version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, Python version, and relevant application version
    validations:
      required: true
  - type: input
    id: locale
    attributes:
      label: Document and application locale
    validations:
      required: true
  - type: dropdown
    id: direction
    attributes:
      label: Dominant content type
      options:
        - Arabic RTL
        - English LTR
        - Mixed Arabic-English
        - Table-heavy
        - Image or object-heavy
    validations:
      required: true
  - type: dropdown
    id: route
    attributes:
      label: Route used
      options: [FAST, STRUCTURED, COMPLEX]
    validations:
      required: true
  - type: input
    id: elapsed
    attributes:
      label: Measured elapsed seconds
      placeholder: "145.8"
    validations:
      required: true
  - type: input
    id: counts
    attributes:
      label: Build, repair, fallback, and QA-failure counts
      placeholder: builds=1, repairs=1, fallbacks=0, qa_failures=1
    validations:
      required: true
  - type: textarea
    id: synthetic_shape
    attributes:
      label: Synthetic document shape and reproduction steps
    validations:
      required: true
  - type: textarea
    id: bottleneck
    attributes:
      label: Observed bottleneck or repeated invariant
      description: Describe evidence; do not guess at a cause if it was not measured.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected route behavior
    validations:
      required: true
  - type: dropdown
    id: validation
    attributes:
      label: Highest validation surface actually performed
      options:
        - Built only
        - Structurally audited
        - Rendered and inspected
        - Word Desktop verified
    validations:
      required: true
  - type: textarea
    id: audit
    attributes:
      label: Sanitized audit and timing summary
      description: Include counts and categories only; remove local paths, source text, and identifying values.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: Logs and fixtures contain no user-profile paths, secrets, client content, or conversation references.
          required: true
        - label: I have permission to share every attached synthetic or sanitized sample publicly.
          required: true
