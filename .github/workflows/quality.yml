name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install . PyYAML

      - name: Check publication structure and privacy
        run: python scripts/check_publication.py .

      - name: Run publication tests
        run: python -m unittest discover -s tests -v

      - name: Run Skill tests
        run: python -m unittest discover -s skills/arabic-word-production/tests -v

      - name: Parse GitHub YAML
        shell: python
        run: |
          from pathlib import Path
          import yaml

          files = sorted(Path(".github").rglob("*.yml")) + sorted(Path(".github").rglob("*.yaml"))
          for path in files:
              with path.open("r", encoding="utf-8") as handle:
                  yaml.safe_load(handle)
          print(f"Parsed {len(files)} GitHub YAML files")
